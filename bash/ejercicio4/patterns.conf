# === Patrones literales ===
password
API_KEY
secret
clave

# === Patrones regex (prefijo obligatorio "regex:") ===
regex:^.*API_KEY\s*=\s*['"].*['"].*$          # Línea que contenga API_KEY = "algo"
regex:\b\d{16}\b                             # Detecta números de 16 dígitos (posibles tarjetas)
regex:-----BEGIN\s+(RSA|DSA|EC)\s+PRIVATE     # Detecta cabeceras de claves privadas
