# ======== Literales (exactos) ========
password
API_KEY
"API_KEY = "
BEGIN RSA PRIVATE KEY

-----BEGIN OPENSSH PRIVATE KEY-----

# ======== Regex (patrones) ========
# API_KEY = "cualquier cosa entre comillas"
regex:^.*API_KEY[[:space:]]*=[[:space:]]*["'][^"']+["'].*$

# JWT (tres bloques base64url separados por puntos)
regex:\b[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b

# Emails simples
regex:[^[:space:]@]+@[^[:space:]@]+\.[A-Za-z]+

# AWS Access Key ID (forma típica)
regex:\bAKIA[0-9A-Z]{16}\b

# Tokens hex de 32+ chars
regex:\b[0-9A-Fa-f]{32,}\b

# secretToken: valor (espacios opcionales)
regex:secretToken[[:space:]]*:[[:space:]]*[A-Za-z0-9._-]{8,}
